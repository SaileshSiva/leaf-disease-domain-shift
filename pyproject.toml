[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leafshift"
version = "0.1.0"
description = "Lab-to-field domain shift in leaf disease classification (PlantVillage to PlantDoc)"
requires-python = ">=3.10"
# Pinned dependencies live in requirements.txt.

[tool.setuptools]
packages = ["leafshift"]
